name: Update careers page
 
on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
 
permissions:
  contents: write
  pull-requests: write
 
jobs:
  update-careers-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Fetch + classify + regenerate careers page
        run: python scripts/fetch_jobs.py --days 10
 
      - name: Open pull request with any changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update careers page"
          title: "Careers page update"
          body: |
            Automated weekly refresh of the careers page from the
            robotics-worldwide mailing list. Review the diff in
            `docs/careers/index.md` before merging -- classification is
            keyword-based and can include false positives.
          branch: automated/careers-page-update
          delete-branch: true
          add-paths: |
            src/careers.md
            data/jobs_seen.json
 

