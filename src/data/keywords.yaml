# Editable by any committee member -- no code changes needed to tune matching.
#
# A mailing-list message is proposed as a job posting only if its SUBJECT
# contains a `job_signal` phrase AND at least one `tc_relevance` phrase.
# Matching is case-insensitive substring matching over the subject only
# (the RSS feed carries no message text, and message pages sit behind
# Sympa's anti-harvesting gate).
#
# robotics-worldwide tags every subject ([jobs], [meetings], [news], ...),
# so the [jobs] tag is the job signal.

job_signal:
  - "[jobs]"

# Subjects are short, so these are deliberately broad. The broadest entries
# are control, humanoid, manipulation and planning: trim them if the page
# gets noisy, add more if relevant postings are being missed.
tc_relevance:
  - optimal control
  - optimization
  - optimisation
  - trajectory optimization
  - trajectory optimisation
  - model predictive control
  - mpc
  - robot dynamics
  - rigid body dynamics
  - reinforcement learning
  - motion planning
  - legged locomotion
  - legged robot
  - convex optimization
  - nonlinear optimization
  - numerical optimization
  - contact-implicit
  - dynamic programming
  - trajectory generation
  - whole-body control
  - koopman
  - safe learning
  - motion generation
  - manipulation planning
  # title-level additions
  - control
  - robot learning
  - locomotion
  - legged
  - humanoid
  - manipulation
  - planning
  - dynamics
  - trajectory
